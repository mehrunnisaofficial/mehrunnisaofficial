<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 1200 200">

  <!-- OUTER CARD -->

  <rect
    x="1"
    y="1"
    width="1198"
    height="198"
    rx="14"
    fill="#000000"
    stroke="#E1DCC9"
    stroke-opacity="0.35"/>


  <!-- TITLE -->

  <text
    x="50"
    y="40"
    fill="#E1DCC9"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    letter-spacing="3">

    THE ROAD TO AI ENGINEERING

  </text>


  <!-- PROGRESS PERCENTAGE -->

  <text
    x="50"
    y="74"
    fill="#E1DCC9"
    font-family="Arial, Helvetica, sans-serif"
    font-size="26"
    font-weight="600">

    2.0%

  </text>


  <!-- CONTRIBUTIONS -->

  <text
    x="50"
    y="96"
    fill="#E1DCC9"
    fill-opacity="0.65"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12">

    197 / 10,000 contribution points

  </text>


  <!-- FULL PROGRESS BAR -->

  <rect
    x="90"
    y="116"
    width="1020"
    height="4"
    rx="2"
    fill="#292929"/>


  <!-- CURRENT PROGRESS -->

  <rect
    x="90"
    y="116"
    width="20.4"
    height="4"
    rx="2"
    fill="#E1DCC9"/>


  <!-- PROGRESS DOT -->

  <circle
    cx="110.4"
    cy="118.0"
    r="5"
    fill="#E1DCC9"/>


  <!-- CURRENT STAGE LABEL -->

  <text
    x="50"
    y="142"
    fill="#E1DCC9"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    letter-spacing="2">

    CURRENT STAGE

  </text>


  <!-- CURRENT STAGE -->

  <text
    x="50"
    y="164"
    fill="#E1DCC9"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="600">

    FOUNDATION

  </text>


  <!-- FOOTER -->

  <text
    x="50"
    y="180"
    fill="#E1DCC9"
    fill-opacity="0.55"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11">

    Every contribution moves the journey forward.

  </text>

</svg>