name: Update AI Engineering Progress

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # CHECKOUT REPOSITORY
      # -----------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------
      # FETCH GITHUB CONTRIBUTION DATA
      # -----------------------------------------

      - name: Fetch GitHub contribution data
        run: |
          curl -L \
            "https://github-contributions-api.jogruber.de/v4/mehrunnisaofficial" \
            -o contributions.json


      # -----------------------------------------
      # GENERATE PROGRESS CARD
      # -----------------------------------------

      - name: Generate progress card
        run: |
          python - <<'PY'

          import json
          from pathlib import Path


          # -----------------------------------------
          # SETTINGS (geometry lives here, never inside
          # the stage if/elif/else block below)
          # -----------------------------------------

          GOAL = 10000

          # Wide, responsive reference canvas. No fixed
          # width/height on the <svg> root -> the browser
          # derives aspect ratio purely from viewBox, so
          # width="100%" in the README scales it naturally.
          VIEW_WIDTH = 1200
          VIEW_HEIGHT = 250

          PAD_X = 40      # small, equal left/right margin
          PAD_TOP = 28
          BAR_HEIGHT = 5

          CONTENT_X = PAD_X
          BAR_X = PAD_X
          BAR_WIDTH = VIEW_WIDTH - (PAD_X * 2)

          TITLE_Y = PAD_TOP + 16
          PERCENT_Y = TITLE_Y + 40
          CONTRIB_Y = PERCENT_Y + 26
          BAR_Y = CONTRIB_Y + 24
          STAGE_LABEL_Y = BAR_Y + 34
          STAGE_VALUE_Y = STAGE_LABEL_Y + 26
          FOOTER_Y = STAGE_VALUE_Y + 20


          # -----------------------------------------
          # READ CONTRIBUTION DATA
          # -----------------------------------------

          with open(
              "contributions.json",
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          total_contributions = sum(
              int(value)
              for value in data.get("total", {}).values()
          )


          # -----------------------------------------
          # CALCULATE PROGRESS
          # -----------------------------------------

          progress = min(
              100,
              round(
                  (total_contributions / GOAL) * 100,
                  1
              )
          )


          progress_width = (
              BAR_WIDTH * progress / 100
          )


          print(
              f"Total contributions: {total_contributions}"
          )

          print(
              f"Goal: {GOAL}"
          )

          print(
              f"Progress: {progress}%"
          )


          # -----------------------------------------
          # CURRENT STAGE
          # (purely a label lookup, no geometry here)
          # -----------------------------------------

          if progress < 10:
              stage = "FOUNDATION"

          elif progress < 25:
              stage = "CORE CS"

          elif progress < 45:
              stage = "MACHINE LEARNING"

          elif progress < 65:
              stage = "DEEP LEARNING"

          elif progress < 85:
              stage = "AI SYSTEMS"

          else:
              stage = "AI ENGINEERING"


          # -----------------------------------------
          # SVG CARD
          # -----------------------------------------

          svg = f'''<svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 {VIEW_WIDTH} {VIEW_HEIGHT}">

            <!-- OUTER CARD -->

            <rect
              x="1"
              y="1"
              width="{VIEW_WIDTH - 2}"
              height="{VIEW_HEIGHT - 2}"
              rx="16"
              fill="#000000"
              stroke="#E1DCC9"
              stroke-opacity="0.35"/>


            <!-- TITLE -->

            <text
              x="{CONTENT_X}"
              y="{TITLE_Y}"
              fill="#E1DCC9"
              font-family="Arial, Helvetica, sans-serif"
              font-size="15"
              letter-spacing="3">

              THE ROAD TO AI ENGINEERING

            </text>


            <!-- PROGRESS PERCENTAGE -->

            <text
              x="{CONTENT_X}"
              y="{PERCENT_Y}"
              fill="#E1DCC9"
              font-family="Arial, Helvetica, sans-serif"
              font-size="32"
              font-weight="600">

              {progress}%

            </text>


            <!-- CONTRIBUTIONS -->

            <text
              x="{CONTENT_X}"
              y="{CONTRIB_Y}"
              fill="#E1DCC9"
              fill-opacity="0.65"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14">

              {total_contributions:,} / {GOAL:,} contribution points

            </text>


            <!-- FULL PROGRESS BAR -->

            <rect
              x="{BAR_X}"
              y="{BAR_Y}"
              width="{BAR_WIDTH}"
              height="{BAR_HEIGHT}"
              rx="3"
              fill="#292929"/>


            <!-- CURRENT PROGRESS -->

            <rect
              x="{BAR_X}"
              y="{BAR_Y}"
              width="{progress_width}"
              height="{BAR_HEIGHT}"
              rx="3"
              fill="#E1DCC9"/>


            <!-- PROGRESS DOT -->

            <circle
              cx="{BAR_X + progress_width}"
              cy="{BAR_Y + BAR_HEIGHT / 2}"
              r="6"
              fill="#E1DCC9"/>


            <!-- CURRENT STAGE LABEL -->

            <text
              x="{CONTENT_X}"
              y="{STAGE_LABEL_Y}"
              fill="#E1DCC9"
              font-family="Arial, Helvetica, sans-serif"
              font-size="12"
              letter-spacing="2">

              CURRENT STAGE

            </text>


            <!-- CURRENT STAGE -->

            <text
              x="{CONTENT_X}"
              y="{STAGE_VALUE_Y}"
              fill="#E1DCC9"
              font-family="Arial, Helvetica, sans-serif"
              font-size="20"
              font-weight="600">

              {stage}

            </text>


            <!-- FOOTER -->

            <text
              x="{CONTENT_X}"
              y="{FOOTER_Y}"
              fill="#E1DCC9"
              fill-opacity="0.55"
              font-family="Arial, Helvetica, sans-serif"
              font-size="12">

              Every contribution moves the journey forward.

            </text>

          </svg>'''


          # -----------------------------------------
          # SAVE SVG
          # -----------------------------------------

          output = Path(
              "assets/ai-progress.svg"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              svg,
              encoding="utf-8"
          )


          print(
              "Progress card generated successfully."
          )

          PY


      # -----------------------------------------
      # CACHE-BUST THE README IMAGE REFERENCE
      # -----------------------------------------

      - name: Bump cache-busting version in README
        run: |
          sed -i -E \
            "s/(ai-progress\.svg\?v=)[0-9]+/\1${{ github.run_number }}/" \
            README.md


      # -----------------------------------------
      # COMMIT UPDATED CARD
      # -----------------------------------------

      - name: Commit updated progress card
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add assets/ai-progress.svg README.md


          if git diff --cached --quiet; then

            echo "No progress update needed."

          else

            git commit \
              -m "chore: update AI engineering progress"

            git push

          fi
