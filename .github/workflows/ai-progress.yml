name: Update AI Engineering Progress

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # CHECKOUT REPOSITORY
      # -----------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------
      # FETCH GITHUB CONTRIBUTION DATA
      # -----------------------------------------

      - name: Fetch GitHub contribution data
        run: |
          curl -L \
            "https://github-contributions-api.jogruber.de/v4/mehrunnisaofficial" \
            -o contributions.json


      # -----------------------------------------
      # GENERATE PROGRESS CARD
      # -----------------------------------------

      - name: Generate progress card
        run: |
          python - <<'PY'

          import json
          from pathlib import Path


          # -----------------------------------------
          # SETTINGS (geometry lives here, never inside
          # the stage if/elif/else block below)
          # -----------------------------------------

          GOAL = 10000

          # Wide + short canvas -> thin card once width="100%"
          # scales it to match your activity graph's width.
          VIEW_WIDTH = 1200
          VIEW_HEIGHT = 200

          PAD_X = 50       # left/right text margin
          PAD_TOP = 26
          BAR_HEIGHT = 4

          # Bar is deliberately narrower than the text content
          # so it does NOT touch the card's inner edges.
          BAR_INSET = 40

          CONTENT_X = PAD_X
          CONTENT_WIDTH = VIEW_WIDTH - (PAD_X * 2)

          BAR_X = CONTENT_X + BAR_INSET
          BAR_WIDTH = CONTENT_WIDTH - (BAR_INSET * 2)

          TITLE_Y = PAD_TOP + 14
          PERCENT_Y = TITLE_Y + 34
          CONTRIB_Y = PERCENT_Y + 22
          BAR_Y = CONTRIB_Y + 20
          STAGE_LABEL_Y = BAR_Y + 26
          STAGE_VALUE_Y = STAGE_LABEL_Y + 22
          FOOTER_Y = STAGE_VALUE_Y + 16


          # -----------------------------------------
          # READ CONTRIBUTION DATA
          # -----------------------------------------

          with open(
              "contributions.json",
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          total_contributions = sum(
              int(value)
              for value in data.get("total", {}).values()
          )


          # -----------------------------------------
          # CALCULATE PROGRESS
          # -----------------------------------------

          progress = min(
              100,
              round(
                  (total_contributions / GOAL) * 100,
                  1
              )
          )


          progress_width = (
              BAR_WIDTH * progress / 100
          )


          print(
              f"Total contributions: {total_contributions}"
          )

          print(
              f"Goal: {GOAL}"
          )

          print(
              f"Progress: {progress}%"
          )


          # -----------------------------------------
          # CURRENT STAGE
          # -----------------------------------------

          if progress < 10:
              stage = "FOUNDATION"

          elif progress < 25:
              stage = "CORE CS"

          elif progress < 45:
              stage = "MACHINE LEARNING"

          elif progress < 65:
              stage = "DEEP LEARNING"

          elif progress < 85:
              stage = "AI SYSTEMS"

          else:
              stage = "AI ENGINEERING"


          # -----------------------------------------
          # SVG CARD
          # -----------------------------------------

          svg = f'''<svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 {VIEW_WIDTH} {VIEW_HEIGHT}">

            <!-- OUTER CARD -->

            <rect
              x="1"
              y="1"
              width="{VIEW_WIDTH - 2}"
              height="{VIEW_HEIGHT - 2}"
              rx="14"
              fill="#000000"
              stroke="#E1DCC9"
              stroke-opacity="0.35"/>


            <!-- TITLE -->

            <text
              x="{CONTENT_X}"
              y="{TITLE_Y}"
              fill="#E1DCC9"
              font-family="Arial, Helvetica, sans-serif"
              font-size="13"
              letter-spacing="3">

              THE ROAD TO AI ENGINEERING

            </text>


            <!-- PROGRESS PERCENTAGE -->

            <text
              x="{CONTENT_X}"
              y="{PERCENT_Y}"
              fill="#E1DCC9"
              font-family="Arial, Helvetica, sans-serif"
              font-size="26"
              font-weight="600">

              {progress}%

            </text>


            <!-- CONTRIBUTIONS -->

            <text
              x="{CONTENT_X}"
              y="{CONTRIB_Y}"
              fill="#E1DCC9"
              fill-opacity="0.65"
              font-family="Arial, Helvetica, sans-serif"
              font-size="12">

              {total_contributions:,} / {GOAL:,} contribution points

            </text>


            <!-- FULL PROGRESS BAR -->

            <rect
              x="{BAR_X}"
              y="{BAR_Y}"
              width="{BAR_WIDTH}"
              height="{BAR_HEIGHT}"
              rx="2"
              fill="#292929"/>


            <!-- CURRENT PROGRESS -->

            <rect
              x="{BAR_X}"
              y="{BAR_Y}"
              width="{progress_width}"
              height="{BAR_HEIGHT}"
              rx="2"
              fill="#E1DCC9"/>


            <!-- PROGRESS DOT -->

            <circle
              cx="{BAR_X + progress_width}"
              cy="{BAR_Y + BAR_HEIGHT / 2}"
              r="5"
              fill="#E1DCC9"/>


            <!-- CURRENT STAGE LABEL -->

            <text
              x="{CONTENT_X}"
              y="{STAGE_LABEL_Y}"
              fill="#E1DCC9"
              font-family="Arial, Helvetica, sans-serif"
              font-size="11"
              letter-spacing="2">

              CURRENT STAGE

            </text>


            <!-- CURRENT STAGE -->

            <text
              x="{CONTENT_X}"
              y="{STAGE_VALUE_Y}"
              fill="#E1DCC9"
              font-family="Arial, Helvetica, sans-serif"
              font-size="17"
              font-weight="600">

              {stage}

            </text>


            <!-- FOOTER -->

            <text
              x="{CONTENT_X}"
              y="{FOOTER_Y}"
              fill="#E1DCC9"
              fill-opacity="0.55"
              font-family="Arial, Helvetica, sans-serif"
              font-size="11">

              Every contribution moves the journey forward.

            </text>

          </svg>'''


          # -----------------------------------------
          # SAVE SVG
          # -----------------------------------------

          output = Path(
              "assets/ai-progress.svg"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              svg,
              encoding="utf-8"
          )


          print(
              "Progress card generated successfully."
          )

          PY


      # -----------------------------------------
      # CACHE-BUST THE README IMAGE REFERENCE
      # -----------------------------------------

      - name: Bump cache-busting version in README
        run: |
          sed -i -E \
            "s/(ai-progress\.svg\?v=)[0-9]+/\1${{ github.run_number }}/" \
            README.md


      # -----------------------------------------
      # COMMIT UPDATED CARD
      # -----------------------------------------

      - name: Commit updated progress card
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add assets/ai-progress.svg README.md


          if git diff --cached --quiet; then

            echo "No progress update needed."

          else

            git commit \
              -m "chore: update AI engineering progress"

            git pull --rebase origin main

            git push

          fi
